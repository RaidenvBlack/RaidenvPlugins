name: Test Dalamud release automation

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/dalamud-release/**
      - .github/workflows/dalamud-automation-test.yml
      - .github/workflows/dalamud-release.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/dalamud-release/**
      - .github/workflows/dalamud-automation-test.yml
      - .github/workflows/dalamud-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Version and metadata scripts
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out central repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test semantic version preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'version-test'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $project = Join-Path $testRoot 'ExamplePlugin.csproj'
          $manifest = Join-Path $testRoot 'ExamplePlugin.json'
          $projectText = @'
          <Project Sdk="Dalamud.NET.Sdk/15.0.0">
            <PropertyGroup>
              <TargetFramework>net10.0-windows7.0</TargetFramework>
              <Version>1.4.8.7</Version>
            </PropertyGroup>
          </Project>
          '@
          $manifestText = @'
          {
            "InternalName": "ExamplePlugin",
            "AssemblyVersion": "1.4.8.7",
            "DalamudApiLevel": 15
          }
          '@
          [IO.File]::WriteAllText($project, $projectText)
          [IO.File]::WriteAllText($manifest, $manifestText)

          $env:GITHUB_OUTPUT = Join-Path $testRoot 'outputs.txt'
          & ./.github/actions/dalamud-release/scripts/Prepare-Version.ps1 `
            -ProjectPath $project `
            -ManifestPath $manifest `
            -Bump patch `
            -ApplyVersionChange $true `
            -DotnetVersion auto

          [xml] $updatedProject = [IO.File]::ReadAllText($project)
          $updatedManifest = [IO.File]::ReadAllText($manifest) | ConvertFrom-Json
          if ([string] $updatedProject.Project.PropertyGroup.Version -ne '1.4.9.0') {
            throw 'PATCH version calculation did not produce 1.4.9.0.'
          }
          if ([string] $updatedManifest.AssemblyVersion -ne '1.4.9.0') {
            throw 'Source manifest version was not updated consistently.'
          }
          $outputs = Get-Content -LiteralPath $env:GITHUB_OUTPUT
          foreach ($expected in @('version=1.4.9.0', 'dotnet-version=10.0.x', 'api-level=15')) {
            if ($outputs -cnotcontains $expected) { throw "Missing action output '$expected'." }
          }

      - name: Test central ZIP and metadata update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'repository-test'
          $central = Join-Path $testRoot 'central'
          $packageContent = Join-Path $testRoot 'package'
          New-Item -ItemType Directory -Path $central, $packageContent -Force | Out-Null
          Copy-Item -LiteralPath ./repo.json -Destination (Join-Path $central 'repo.json')
          Copy-Item -LiteralPath ./BlackjackSolver.zip -Destination (Join-Path $central 'BlackjackSolver.zip')
          Expand-Archive -LiteralPath ./BlackjackSolver.zip -DestinationPath $packageContent

          $beforeItems = @([IO.File]::ReadAllText((Join-Path $central 'repo.json')) | ConvertFrom-Json)
          $before = @($beforeItems | Where-Object InternalName -CEQ 'BlackjackSolver')[0]
          & ./.github/actions/dalamud-release/scripts/Update-Repository.ps1 `
            -RepositoryPath $central `
            -MetadataPath repo.json `
            -PackagePath (Resolve-Path ./BlackjackSolver.zip).Path `
            -PackageManifestPath (Join-Path $packageContent 'BlackjackSolver.json') `
            -CentralRepository RaidenvBlack/RaidenvPlugins `
            -CentralBranch main `
            -InternalName BlackjackSolver `
            -ZipName BlackjackSolver.zip

          $afterItems = @([IO.File]::ReadAllText((Join-Path $central 'repo.json')) | ConvertFrom-Json)
          $after = @($afterItems | Where-Object InternalName -CEQ 'BlackjackSolver')[0]
          $managed = @(
            'AssemblyVersion', 'DalamudApiLevel', 'DownloadLinkInstall',
            'DownloadLinkUpdate', 'DownloadLinkTesting', 'TestingAssemblyVersion'
          )
          foreach ($property in $before.PSObject.Properties) {
            if ($property.Name -in $managed) { continue }
            $beforeValue = $property.Value | ConvertTo-Json -Compress -Depth 100
            $afterValue = $after.($property.Name) | ConvertTo-Json -Compress -Depth 100
            if ($beforeValue -cne $afterValue) {
              throw "Non-release field '$($property.Name)' changed unexpectedly."
            }
          }

          $expectedUrl = 'https://raw.githubusercontent.com/RaidenvBlack/RaidenvPlugins/main/BlackjackSolver.zip'
          if ($after.DownloadLinkInstall -cne $expectedUrl -or $after.DownloadLinkUpdate -cne $expectedUrl) {
            throw 'Canonical central download URLs were not written.'
          }
          $sourceHash = (Get-FileHash -LiteralPath ./BlackjackSolver.zip -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -LiteralPath (Join-Path $central 'BlackjackSolver.zip') -Algorithm SHA256).Hash
          if ($sourceHash -cne $targetHash) { throw 'Copied ZIP hash changed.' }

          $manifestPath = Join-Path $packageContent 'BlackjackSolver.json'
          $downgradeManifest = [IO.File]::ReadAllText($manifestPath) | ConvertFrom-Json
          $downgradeManifest.AssemblyVersion = '1.0.0.0'
          [IO.File]::WriteAllText(
            $manifestPath,
            ($downgradeManifest | ConvertTo-Json -Depth 100)
          )
          $downgradeRejected = $false
          try {
            & ./.github/actions/dalamud-release/scripts/Update-Repository.ps1 `
              -RepositoryPath $central `
              -MetadataPath repo.json `
              -PackagePath (Resolve-Path ./BlackjackSolver.zip).Path `
              -PackageManifestPath $manifestPath `
              -CentralRepository RaidenvBlack/RaidenvPlugins `
              -CentralBranch main `
              -InternalName BlackjackSolver `
              -ZipName BlackjackSolver.zip
          } catch {
            if ($_.Exception.Message -like 'Refusing to downgrade*') {
              $downgradeRejected = $true
            } else {
              throw
            }
          }
          if (-not $downgradeRejected) { throw 'A central version downgrade was not rejected.' }
